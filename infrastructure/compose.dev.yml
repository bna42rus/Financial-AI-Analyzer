name: finance-development
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: finance_development
      POSTGRES_USER: development_bootstrap_owner
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set a random Development password}
    ports:
      - "127.0.0.1:5410:5432"
    volumes:
      - development_db:/var/lib/postgresql
    networks: [development]
volumes:
  development_db:
networks:
  development:
