name: Assistant tariff verification
on:
  push:
    branches: [feature/assistant-tariff-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tariff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install bounded PDF extractor
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils util-linux
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Check API and UI types
        run: |
          pnpm --filter @finance/api exec tsc --noEmit
          pnpm run check:web
      - name: Check tariff updates, historical billing and dispatch guards without paid calls
        run: pnpm --filter @finance/api exec node --import tsx --test test/classification-tariff.test.ts test/classification-smoke-support.test.ts test/assistant-monthly.test.ts test/classification-admission.test.ts test/analyzer-cost-policy.test.ts test/assistant-workflow.test.ts test/assistant-durability.test.ts test/analyzer-assistant-settings.test.ts test/assistant-report.test.ts ../../packages/analyzer/test/task-context.test.ts
      - name: Check immutable Staging update and installer syntax
        run: |
          sudo "$(command -v python3)" -B scripts/test-update-staging-release.py
          python3 -B scripts/test-install-assistant-staging.py
          python3 -B scripts/test-install-tariff-extractor.py
          bash -n scripts/prepare-staging-release.sh
      - name: Verify current official tariff without credentials or model calls
        run: pnpm --filter @finance/api exec node --import tsx ../../scripts/verify-cloud-tariff.mjs
