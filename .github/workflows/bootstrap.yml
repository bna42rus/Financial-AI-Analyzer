name: bootstrap-integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap-checks:
    name: bootstrap-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify sources, calculations, types and web build
        run: pnpm run check
      - name: Install browser for interface checks
        run: pnpm --filter @finance/web exec playwright install --with-deps chromium --only-shell
      - name: Check interface on desktop and mobile
        run: pnpm run test:e2e
