name: bootstrap-integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/web-settings-recovery, feature/access-admin-requests, feature/server-access-security, feature/invitation-registration, feature/access-renewal, feature/manual-access, feature/mail-notifications, feature/finance-foundation, feature/account-structure-deletion, feature/category-counterparty-structure, feature/exclusions-history, feature/financial-reset, feature/derived-links, feature/import-preparation, feature/import-ingestion, feature/local-bank-parsers, feature/safe-bank-source, feature/live-import-ui, feature/live-operation-review, feature/spec-screen-audit, feature/import-cancellation-dedupe, feature/duplicate-merge, feature/operation-relations, feature/review-bulk-actions, feature/settings-rule-editors, feature/deletion-reset-ui, feature/import-review-expansion, feature/local-tabular-ocr, feature/comprehensive-spec-audit, feature/operations-views-pagination]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap-checks:
    name: bootstrap-checks
    runs-on: ubuntu-latest
    # Real PostgreSQL and HTTP suites include two 10k-row browser journeys.
    # Individual request/test timeouts still detect stalled operations.
    timeout-minutes: 30
    services:
      postgres:
        # Docker Official Images mirror avoids Docker Hub shared-runner pull limits.
        # https://www.docker.com/blog/news-from-aws-reinvent-docker-official-images-on-amazon-ecr-public/
        image: public.ecr.aws/docker/library/postgres:18.4
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject known high and critical dependency advisories
        run: pnpm audit --audit-level=high
      - name: Verify sources, calculations, types and web build
        run: pnpm run check
      - name: Check auth, TOTP, recovery, ownership and database roles on PostgreSQL 18
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
        run: pnpm run test:security
      - name: Install browser for interface checks
        run: pnpm --filter @finance/web exec playwright install --with-deps chromium --only-shell
      - name: Check full application, payment review and registration over HTTP with PostgreSQL
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
        run: pnpm run test:access-browser
      - name: Save real PostgreSQL Operations desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: operations-previews
          path: apps/api/operations-previews/*.png
          if-no-files-found: error
          retention-days: 7

  interface-checks:
    name: interface-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser for interface checks
        run: pnpm --filter @finance/web exec playwright install --with-deps chromium --only-shell
      - name: Check interface on desktop and mobile
        run: pnpm run test:e2e
      - name: Save financial reset desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: financial-reset-previews
          path: apps/web/test-results/**/financial-reset-preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Save similar-purchase Review desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: review-group-previews
          path: apps/web/test-results/**/review-group-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Save CSV XLSX OCR upload desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: local-import-previews
          path: apps/web/test-results/**/local-import-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Save synthetic interface diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-failure-diagnostics
          path: |
            apps/web/test-results/
            apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7

  local-import-checks:
    name: local-import-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser for local import checks
        run: pnpm --filter @finance/web exec playwright install --with-deps chromium --only-shell
      - name: Check actual CSV XLSX and scanned PDF locally in desktop and mobile browsers
        run: pnpm --filter @finance/web exec playwright test e2e/import-tabular.spec.ts
      - name: Save synthetic local import diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-import-failure-diagnostics
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
